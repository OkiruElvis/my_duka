{% extends 'base.html' %}
{% block title %} Products {% endblock %}
{% block content %}
<div class="container">

    <p>This is the products page</p>

    {{ products }}

    {% for product in products %}
        {% if product=='eggs' %}
            <h1>{{ product | capitalize }}</h1>
        {% endif %}
    {% endfor %}


</div>
{% endblock %}
